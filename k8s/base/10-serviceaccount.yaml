#
# Identity for every msk-bench client pod (producers and consumers).
# MSK IAM auth (aws-msk-iam-auth 2.2.0) uses the AWS SDK v2 default credential chain.
#
#   EKS cluster from eks/cluster.yaml (supported path): nothing else is needed.
#     eksctl already creates this ServiceAccount, the Pod Identity role
#     msk-bench-eks-client-pod-role and the association; applying this file over
#     it is harmless (it only adds the label below).
#
#   Bring-your-own EKS cluster: configure exactly one mechanism (see k8s/README.md, "IAM"):
#     EKS Pod Identity (preferred): create a role with k8s/iam/trust-policy-pod-identity.json
#       and k8s/iam/msk-bench-client-policy.json, then
#         aws eks create-pod-identity-association --cluster-name <eks> \
#           --namespace msk-bench --service-account msk-bench-client --role-arn <role-arn>
#       No annotation is needed.
#     IRSA: use k8s/iam/trust-policy-irsa.json and add this annotation yourself:
#       annotations:
#         eks.amazonaws.com/role-arn: "arn:aws:iam::<account-id>:role/<role-name>"
apiVersion: v1
kind: ServiceAccount
metadata:
  name: msk-bench-client
  namespace: msk-bench
  labels:
    app.kubernetes.io/part-of: msk-bench
