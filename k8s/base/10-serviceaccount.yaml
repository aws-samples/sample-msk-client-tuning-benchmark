#
# Identity for every msk-bench client pod (producers and consumers).
# MSK IAM auth (aws-msk-iam-auth 2.2.0) uses the AWS SDK v2 default credential chain,
# which picks up EITHER mechanism below -- configure exactly one:
#
#   IRSA:              replace the role ARN in the annotation below
#                      (111122223333 = your AWS account ID, REPLACE_ME_msk-bench-client-role = your role name).
#   EKS Pod Identity:  delete the annotation and create an association instead
#                      (see k8s/README.md, "IAM"):
#                        aws eks create-pod-identity-association --cluster-name <eks> \
#                          --namespace msk-bench --service-account msk-bench-client \
#                          --role-arn <role-arn>
# The role's permissions policy is k8s/iam/msk-bench-client-policy.json.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: msk-bench-client
  namespace: msk-bench
  labels:
    app.kubernetes.io/part-of: msk-bench
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::111122223333:role/REPLACE_ME_msk-bench-client-role"
