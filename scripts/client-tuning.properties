# Kafka client tuning for the load benchmark (producer AND consumer).
#
# This file is synced to every client host on each run-on-host.sh invocation and
# passed to the perf tools via --producer.config / --consumer.config, layered ON
# TOP of the mandatory IAM auth file (/opt/kafka/config/client-iam.properties).
#
# By default it is EMPTY of tuning (everything runs at Kafka defaults), so the
# benchmark measures the broker under a default client, which is what we want as
# a baseline. To tweak the workload:
#   1. Uncomment / add properties below.
#   2. Stop load:  03-stop-load.sh
#   3. Start load again (run-on-host.sh re-syncs this file automatically).
#
# The hot knobs are also exposed as trailing CLI args on 01-start-producers.sh /
# 02-start-consumers.sh, which override whatever is set here for that run. Use
# this file for settings without a dedicated flag, or to make a tweak stick.
#
# ---- Producer tunables (Kafka defaults shown in comments) ----
# linger.ms=0
# batch.size=16384
# compression.type=none        # none | gzip | snappy | lz4 | zstd
# acks=all                     # all | 1 | 0  (perf test defaults acks=all via --producer-props)
# buffer.memory=33554432
# max.in.flight.requests.per.connection=5
#
# ---- Consumer tunables (Kafka defaults shown in comments) ----
# fetch.min.bytes=1
# fetch.max.bytes=57671680
# max.partition.fetch.bytes=1048576
# fetch.max.wait.ms=500
# max.poll.records=500
