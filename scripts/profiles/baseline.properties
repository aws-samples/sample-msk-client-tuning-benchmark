#
# Profile: baseline (TEMPLATE)
# Replace these values with your production client settings so the baseline reproduces production.
#
# As shipped, every value below is the Apache Kafka 3.9 client default, written
# out explicitly so the A/B comparison against aws-tuned is visible key by key.
# Add any other keys your production clients set (for example a custom
# partitioner or request.timeout.ms). Keep authentication settings out of this
# file: they come from the IAM auth properties on the client host or pod.
#
# Producer AND consumer keys live in one file; each client ignores the other
# side's keys (Kafka logs a harmless "supplied but isn't a known config" WARN).

# ---- Producer ----
acks=all
linger.ms=0
batch.size=16384
buffer.memory=33554432
compression.type=none
enable.idempotence=true
max.in.flight.requests.per.connection=5
send.buffer.bytes=131072

# ---- Consumer ----
fetch.min.bytes=1
fetch.max.wait.ms=500
max.partition.fetch.bytes=1048576
max.poll.records=500
max.poll.interval.ms=300000
session.timeout.ms=45000
heartbeat.interval.ms=3000
partition.assignment.strategy=org.apache.kafka.clients.consumer.RangeAssignor,org.apache.kafka.clients.consumer.CooperativeStickyAssignor
receive.buffer.bytes=65536
auto.commit.interval.ms=5000

# ---- Both ----
connections.max.idle.ms=540000
