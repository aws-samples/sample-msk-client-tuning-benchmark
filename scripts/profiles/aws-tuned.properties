# Profile: aws-tuned
# The recommended client profile from the blog post "Right-sizing Amazon MSK by
# tuning your Kafka clients". Fewer, larger, compressed produce requests and
# fewer, fuller fetch requests reduce broker request-handler and network-thread
# work for the same byte throughput.
#
# Producer AND consumer keys live in one file; each client ignores the other
# side's keys (Kafka logs a harmless "supplied but isn't a known config" WARN).

# ---- Producer ----
acks=all
# Wait up to 25 ms to fill a batch: fewer, larger produce requests.
linger.ms=25
# 128 KiB batches (default 16 KiB) so linger.ms can actually fill them.
batch.size=131072
# 64 MiB accumulator to hold the larger in-flight batches.
buffer.memory=67108864
# zstd: best ratio for the CPU cost; cuts bytes on the wire and on disk.
compression.type=zstd
# -1 = let the OS auto-tune the socket send buffer.
send.buffer.bytes=-1
max.in.flight.requests.per.connection=5
enable.idempotence=true

# ---- Consumer ----
# Let the broker hold a fetch until there is some data, instead of answering
# immediately with an empty or tiny response.
fetch.min.bytes=128
fetch.max.wait.ms=1000
max.partition.fetch.bytes=1048576
max.poll.records=1000
max.poll.interval.ms=300000
session.timeout.ms=45000
heartbeat.interval.ms=3000
# Incremental rebalances: members keep their partitions during a rebalance.
partition.assignment.strategy=org.apache.kafka.clients.consumer.CooperativeStickyAssignor
# -1 = let the OS auto-tune the socket receive buffer.
receive.buffer.bytes=-1
# Kafka default; keep >= 5 s to avoid extra offset-commit load on the brokers.
auto.commit.interval.ms=5000

# ---- Both ----
connections.max.idle.ms=540000
